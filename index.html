<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill of Materials (BOM) Request Form</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            line-height: 1.5;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        h2 {
            margin-top: 0;
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.75rem;
            margin-bottom: 1.5rem;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
            background-color: #fff;
        }

        legend {
            font-weight: 600;
            color: var(--primary-color);
            padding: 0 0.5rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 1rem;
        }

        label {
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 0.375rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="date"],
        input[type="number"],
        select {
            padding: 0.625rem 0.75rem;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .table-responsive {
            overflow-x: auto;
            margin-bottom: 1rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.9rem;
        }

        th, td {
            padding: 0.75rem;
            border: 1px solid var(--border-color);
        }

        th {
            background-color: #f1f5f9;
            font-weight: 600;
        }

        table input, table select {
            width: 100%;
            box-sizing: border-box;
            border: none;
            padding: 0.25rem;
            background: transparent;
        }

        table input:focus, table select:focus {
            background: #fff;
            border: 1px solid var(--primary-color);
        }

        .item-number {
            text-align: center;
            font-weight: 600;
            color: #475569;
        }

        .btn {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #cbd5e1;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            width: 100%;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 0.35rem 0.65rem;
        }

        .btn-danger:hover {
            background-color: #fecaca;
        }

        /* Print styles to clean up the page when printed/saved as PDF */
        @media print {
            body {
                background-color: white;
                padding: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
            }
            .action-col {
                display: none !important;
            }
            .btn:not(.btn-primary), button[onclick="addRow()"] {
                display: none !important;
            }
            table input, table select, input, select {
                border: none !important;
                background: transparent !important;
                box-shadow: none !important;
                padding: 0 !important;
            }
            #releasedBy:placeholder-shown {
                color: transparent !important;
                border-bottom: 1px solid #000 !important;
                border-radius: 0 !important;
                padding-left: 0 !important;
                padding-right: 0 !important;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Bill of Materials (BOM) Request Form</h2>
    
    <form onsubmit="event.preventDefault(); window.print();">
        <!-- Project Information -->
        <fieldset>
            <legend>Project Info</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="projectName">Project Name / Code</label>
                    <input type="text" id="projectName" name="projectName" required placeholder="Project Alpha">
                </div>
                <div class="form-group">
                    <label for="requiredDate">Required By Date</label>
                    <input type="date" id="requiredDate" name="requiredDate" required>
                </div>
            </div>
        </fieldset>

        <!-- BOM Items Table -->
        <fieldset>
            <legend>Components & Materials</legend>
            <div class="table-responsive">
                <table id="bomTable">
                    <thead>
                        <tr>
                            <th style="width: 8%;">Item #</th>
                            <th style="width: 34%;">Description</th>
                            <th style="width: 12%;">Quantity</th>
                            <th style="width: 15%;">Unit</th>
                            <th style="width: 21%;">Remarks</th>
                            <th style="width: 10%;" class="action-col">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="item-number">1</td>
                            <td><input type="text" name="description[]" placeholder="10k Ohm Resistor" required></td>
                            <td><input type="number" name="quantity[]" min="1" value="1" required></td>
                            <td>
                                <select name="unit[]">
                                    <option value="pcs">Pc/s</option>
                                    <option value="meters">Meter/s</option>
                                    <option value="pairs">Pair/s</option>
                                    <option value="rolls">Roll/s</option>
                                    <option value="sets">Sets</option>
                                </select>
                            </td>
                            <td><input type="text" name="remarks[]"></td>
                            <td class="action-col"><button type="button" class="btn btn-danger" onclick="removeRow(this)">Remove</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <button type="button" class="btn" onclick="addRow()">+ Add Another Item</button>
        </fieldset>

        <!-- Sign-off / Authorization -->
        <fieldset>
            <legend>Authorization</legend>
            <div class="form-grid">
                <div class="form-group">
                    <label for="requestedBy">Requested By</label>
                    <input type="text" id="requestedBy" name="requestedBy" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label for="releasedBy">Released By</label>
                    <input type="text" id="releasedBy" name="releasedBy" placeholder="Full Name (Optional)">
                </div>
            </div>
        </fieldset>

        <!-- Print Button -->
        <button type="submit" class="btn btn-primary">Print Form</button>
    </form>
</div>

<script>
    function addRow() {
        const tableBody = document.getElementById('bomTable').getElementsByTagName('tbody')[0];
        const newRow = tableBody.insertRow();
        const rowCount = tableBody.rows.length;
        
        newRow.innerHTML = `
            <td class="item-number">${rowCount}</td>
            <td><input type="text" name="description[]" placeholder="Component description" required></td>
            <td><input type="number" name="quantity[]" min="1" value="1" required></td>
            <td>
                <select name="unit[]">
                    <option value="pcs">Pc/s</option>
                    <option value="meters">Meter/s</option>
                    <option value="pairs">Pair/s</option>
                    <option value="rolls">Roll/s</option>
                    <option value="sets">Sets</option>
                </select>
            </td>
            <td><input type="text" name="remarks[]"></td>
            <td class="action-col"><button type="button" class="btn btn-danger" onclick="removeRow(this)">Remove</button></td>
        `;
    }

    function removeRow(button) {
        const row = button.closest('tr');
        const tableBody = document.getElementById('bomTable').getElementsByTagName('tbody')[0];
        
        // Keep at least one row in the table
        if (tableBody.rows.length > 1) {
            row.remove();
            updateRowNumbers();
        } else {
            alert("The BOM must contain at least one item.");
        }
    }

    function updateRowNumbers() {
        const tableBody = document.getElementById('bomTable').getElementsByTagName('tbody')[0];
        for (let i = 0; i < tableBody.rows.length; i++) {
            tableBody.rows[i].cells[0].innerText = i + 1;
        }
    }
</script>

</body>
</html>
